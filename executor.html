<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspeção de Rede — Executor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17202a}
header{background:#173b57;color:#fff;padding:17px 20px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:20px}header p{margin:5px 0 0;opacity:.82;font-size:13px}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:12px;padding:17px;margin-bottom:14px;box-shadow:0 2px 8px #00000010}
.badge{padding:5px 8px;border-radius:15px;background:#edf0f2;font-size:11px;font-weight:bold;white-space:nowrap}
.red{background:#d32f2f;color:#fff}.orange{background:#fb8c00;color:#fff}.yellow{background:#fdd835;color:#5c4b00}.green{background:#d9f0e2;color:#19613a}.blue{background:#dcecf8;color:#174d70}
.primary,.secondary{border:0;border-radius:8px;padding:11px 13px;font-weight:bold;cursor:pointer}
.primary{background:#1f6f43;color:#fff}.secondary{background:#fff;color:#173b57;border:1px solid #173b57}
label{font-size:13px;font-weight:bold;color:#45525e;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd2d8;border-radius:8px;font-size:15px;background:#fff}
textarea{min-height:90px;resize:vertical}
.hidden{display:none!important}
.item{border-left:6px solid #999}.item.extremo{border-color:#c0392b}.item.urgente{border-color:#e67e22}.item.media{border-color:#d4a017}
.itemtop{display:flex;justify-content:space-between;gap:10px}.meta{font-size:13px;line-height:1.65;margin:10px 0}.meta b{color:#34495e}
.notice{background:#eef5f9;border-left:4px solid #173b57;padding:12px;border-radius:7px;font-size:13px;margin-bottom:12px}
.recado{background:#fff4d6;border-left:4px solid #e6a300;padding:12px;border-radius:7px;font-size:13.5px;margin-bottom:14px;font-weight:bold;color:#6b4e00}
.empty{text-align:center;color:#78848e;padding:28px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto;flex:1;min-width:130px}
.topbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.topbar>div{flex:1;min-width:180px}
.checktoggle{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:normal;color:#45525e;margin-top:8px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}
.modalbox{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:18px;max-height:90vh;overflow:auto}.modalbox h3{margin-top:0}
.errbox{color:#a22a20;font-size:12.5px;font-weight:bold;margin-top:8px;display:none}.errbox.show{display:block}
.toastbox{position:fixed;left:50%;bottom:-80px;transform:translateX(-50%);background:#1f6f43;color:#fff;padding:12px 18px;border-radius:9px;font-size:13.5px;font-weight:bold;box-shadow:0 4px 14px #00000030;z-index:50;transition:bottom .25s ease;max-width:90%;text-align:center}
.toastbox.show{bottom:20px}.toastbox.error{background:#a22a20}
.count-summary{font-size:12.5px;color:#78848e;margin-bottom:10px}
.feedgroup-exec{margin-bottom:10px;border:1px solid #e2e6ea;border-radius:10px;overflow:hidden;background:#fff}
.feedgroup-title{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;font-size:14px;font-weight:bold;color:#173b57;cursor:pointer;background:#f6f8f9}
.fg-right{display:flex;align-items:center;gap:8px}
.toggle-icon{font-size:12px;color:#65717d}
.feedgroup-body{padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.demanda-bloco{display:flex;flex-direction:column;background:#fff;border:3px solid #999;border-radius:11px;padding:10px;box-shadow:0 1px 3px #00000010;min-height:130px}
.demanda-bloco.extremo{border-color:#d32f2f}.demanda-bloco.urgente{border-color:#fb8c00}.demanda-bloco.media{border-color:#fdd835}
.db-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.db-icon{font-size:19px}
.d-crit{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:bold;flex-shrink:0}
.d-crit.extremo{background:#d32f2f;color:#fff}.d-crit.urgente{background:#fb8c00;color:#fff}.d-crit.media{background:#fdd835;color:#5c4b00}
.db-title{font-size:12.5px;font-weight:bold;color:#17202a;line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.db-addr{font-size:11px;color:#45525e;line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.db-meta{font-size:10px;color:#78848e;margin-bottom:8px}
.d-btn-block{width:100%;background:#1f6f43;color:#fff;border:0;border-radius:8px;padding:9px;font-weight:bold;font-size:13px;margin-top:auto}
.db-actions{display:flex;gap:6px;margin-top:auto}
.db-actions .d-btn-block{margin-top:0;flex:1}
.d-btn-route{flex:1;background:#fff;color:#173b57;border:1px solid #173b57;border-radius:8px;padding:9px 6px;font-weight:bold;font-size:12px}
.loc-flag{font-size:11px}
.loc-flag.loc-no{opacity:0.3;filter:grayscale(1)}
@media(min-width:480px){.feedgroup-body{grid-template-columns:repeat(3,1fr)}}
@media(max-width:340px){.feedgroup-body{grid-template-columns:1fr}}
button:disabled{opacity:.6}
</style>
</head>
<body>
<header><h1>⚡ Inspeção de Rede — Executor</h1><p>Visualização e baixa das atividades da sua equipe</p></header>
<div id="cacheBanner" class="cache-banner hidden"></div>

<main>
  <div class="card">
    <div class="topbar">
      <div><label>Sua equipe</label><select id="selEquipe" onchange="onEquipeChange()"></select></div>
    </div>
    <label class="checktoggle"><input type="checkbox" id="chkVerTodas" onchange="verTodas=this.checked;renderExecutores()"> Ver todas as pendências (ignorar liberação por equipe)</label>
  </div>

  <div id="recadoBanner" class="recado hidden"></div>
  <div id="semEquipeNotice" class="notice hidden">Nenhuma equipe cadastrada ainda pelo gestor. Marque "Ver todas as pendências" acima para acompanhar tudo enquanto isso, ou peça ao gestor para criar sua equipe na aba Gestor.</div>

  <div class="card">
    <div class="count-summary" id="countSummary"></div>
    <div id="listaExecutor"></div>
  </div>
</main>

<div id="modal" class="modal hidden"><div class="modalbox">
<h3 id="modalTitle">Concluir atividade</h3><div id="modalBody"></div>
</div></div>
<div id="toastBox" class="toastbox"></div>

<script>
const API_URL='/.netlify/functions/proxy';
let config={},dados=[],equipes=[];
let equipeAtual='',verTodas=false;
const TOLERANCIA_ENDERECO=20;

async function apiGet(action,payload){
  let url=API_URL+'?action='+encodeURIComponent(action);
  if(payload!==undefined)url+='&payload='+encodeURIComponent(JSON.stringify(payload));
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data;
}
const CACHE_KEY='inspecao_rede_cache_v1';
function salvarCacheLocal(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({config,dados,equipes,atualizadoEm:new Date().toISOString()}));}
  catch(e){console.error('Falha ao salvar cache local',e);}
}
function carregarCacheLocal(){
  try{const raw=localStorage.getItem(CACHE_KEY);return raw?JSON.parse(raw):null;}
  catch(e){return null;}
}
function formatarDataHora(iso){
  const d=new Date(iso);const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+' às '+p(d.getHours())+':'+p(d.getMinutes());
}
function mostrarAvisoCache(timestamp){
  const el=document.getElementById('cacheBanner');
  if(!el)return;
  el.innerHTML='📴 Sem conexão com a planilha — mostrando dados salvos localmente ('+(timestamp?formatarDataHora(timestamp):'sem data')+'). <button class="secondary" style="padding:4px 9px;font-size:11.5px;margin-left:6px" onclick="tentarNovamente()">🔄 Tentar novamente</button>';
  el.classList.remove('hidden');
}
function ocultarAvisoCache(){
  const el=document.getElementById('cacheBanner');
  if(el){el.classList.add('hidden');el.innerHTML='';}
}
async function carregarTudo(){
  const cache=carregarCacheLocal();
  if(cache){config=cache.config||{};dados=cache.dados||[];equipes=cache.equipes||[];}
  try{
    const r=await apiGet('getAll');
    config=r.config||{};
    dados=r.ocorrencias||[];
    equipes=r.equipes||[];
    salvarCacheLocal();
    ocultarAvisoCache();
  }catch(e){
    console.error(e);
    if(cache){mostrarAvisoCache(cache.atualizadoEm);}
    else{showToast('Não foi possível carregar a planilha. Verifique a conexão.','error');}
  }
}
async function tentarNovamente(){
  await carregarTudo();
  initEquipeSelect();
  renderExecutores();
}
async function salvarOcorrenciaRemota(o){
  await apiGet('updateOcorrencia',o);
}

function showToast(msg,type){const box=document.getElementById('toastBox');box.textContent=msg;box.className='toastbox show'+(type==='error'?' error':'');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>{box.className='toastbox';},3200);}
function cicloLabel(c){return {'1':'Ciclo 1 (Jan/Abr)','2':'Ciclo 2 (Mai/Ago)','3':'Ciclo 3 (Set/Dez)'}[String(c)]||('Ciclo '+c);}
function agoraFormatado(){const d=new Date();const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function nomeEquipe(id){const e=equipes.find(x=>x.id===id);return e?e.nome:'';}
function nomesEquipes(csv){if(!csv)return'';return String(csv).split(',').map(id=>nomeEquipe(id.trim())).filter(Boolean).join(' + ');}
function equipeDesignadaInclui(csv,id){if(!csv)return false;return String(csv).split(',').map(s=>s.trim()).includes(id);}

function initEquipeSelect(){
  const sel=document.getElementById('selEquipe');
  sel.innerHTML='<option value="">Selecione sua equipe...</option>'+equipes.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('');
  document.getElementById('semEquipeNotice').classList.toggle('hidden',equipes.length>0);
}
function onEquipeChange(){
  equipeAtual=document.getElementById('selEquipe').value;
  const eq=equipes.find(e=>e.id===equipeAtual);
  const banner=document.getElementById('recadoBanner');
  if(eq&&eq.recado){banner.textContent='📣 Recado do gestor: '+eq.recado;banner.classList.remove('hidden');}
  else{banner.classList.add('hidden');}
  renderExecutores();
}

function renderExecutores(){
  const eq=equipes.find(e=>e.id===equipeAtual);
  let arr=dados.filter(x=>x.status==='Pendente');
  if(eq&&!verTodas){
    const liberados=new Set(eq.alimentadoresLiberados||[]);
    arr=arr.filter(x=>liberados.has(x.feed)||equipeDesignadaInclui(x.equipeDesignada,eq.id));
  }else if(!eq&&!verTodas){
    arr=[];
  }
  const el=document.getElementById('listaExecutor');
  if(!arr.length){
    document.getElementById('countSummary').textContent='0 atividade(s) pendente(s)';
    el.innerHTML = (!eq&&!verTodas) ? '<div class="empty">Selecione sua equipe acima para ver suas atividades.</div>' : '<div class="empty">Nenhuma atividade pendente encontrada.</div>';
    return;
  }
  const ordem={Extremo:0,Urgente:1,'Média':2};
  const grupos={};
  arr.forEach(x=>{const chave=x.sub+' / '+x.feed;(grupos[chave]=grupos[chave]||[]).push(x);});
  const chaves=Object.keys(grupos).sort();
  document.getElementById('countSummary').textContent=arr.length+' atividade(s) pendente(s) em '+chaves.length+' alimentador(es)';
  el.innerHTML=chaves.map((chave,idx)=>{
    const lista=grupos[chave].sort((a,b)=>ordem[a.criticidade]-ordem[b.criticidade]||(b.data||'').localeCompare(a.data||''));
    const gid='grp'+idx;
    return `<div class="feedgroup-exec">
      <div class="feedgroup-title" onclick="toggleGrupo('${gid}')">
        <span>⚡ ${chave}</span>
        <span class="fg-right"><span class="badge">${lista.length}</span><span class="toggle-icon" id="icon_${gid}">▾</span></span>
      </div>
      <div class="feedgroup-body hidden" id="${gid}">${lista.map(cardExecutor).join('')}</div>
    </div>`;
  }).join('');
}
function toggleGrupo(id){
  const body=document.getElementById(id);
  const icon=document.getElementById('icon_'+id);
  const abrindo=body.classList.contains('hidden');
  body.classList.toggle('hidden');
  if(icon)icon.textContent=abrindo?'▴':'▾';
}
function locBadge(x){
  return x.latitude&&x.longitude?'<span class="loc-flag loc-yes" title="Localização salva">📍</span>':'<span class="loc-flag loc-no" title="Sem localização salva">📍</span>';
}
function cardExecutor(x){
  const desig=nomesEquipes(x.equipeDesignada);
  const critClass=x.criticidade==='Extremo'?'extremo':x.criticidade==='Urgente'?'urgente':'media';
  const temLoc=x.latitude&&x.longitude;
  return `<div class="demanda-bloco ${critClass}">
    <div class="db-top">
      <span class="db-icon">${x.tipo==='Poda'?'🌳':'⚡'}</span>
      <span style="display:flex;align-items:center;gap:5px">${locBadge(x)}<span class="d-crit ${critClass}">${x.criticidade}</span></span>
    </div>
    <div class="db-title">${x.tipo}${x.servico?' — '+x.servico:''}</div>
    <div class="db-addr">${x.endereco}</div>
    <div class="db-meta">Qtd ${x.quantidade} · ${cicloLabel(x.ciclo).replace('Ciclo ','C').split(' ')[0]}${desig?' · 🎯 '+desig:''}${x.observacao?' · 📝':''}</div>
    <div class="db-actions">
      ${temLoc?`<button class="d-btn-route" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${x.latitude},${x.longitude}','_blank')">🗺️ Rota</button>`:''}
      <button class="d-btn-block" onclick="darBaixa('${x.id}')">✔ Concluir</button>
    </div>
  </div>`;
}

function darBaixa(id){
  const x=dados.find(a=>a.id===id);if(!x)return;
  const eq=equipes.find(e=>e.id===equipeAtual);
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalTitle').textContent='Concluir atividade';
  document.getElementById('modalBody').innerHTML=`<div class="notice"><b>${x.sub} / ${x.feed}</b><br>${x.tipo}${x.servico?' — '+x.servico:''}<br>${x.endereco}</div><label>Equipe responsável</label><input id="equipe" value="${eq?eq.nome:''}" placeholder="Ex.: Equipe 01 / Turma A"><label style="margin-top:10px">Observação da execução (opcional)</label><textarea id="obsExec" placeholder="Informe alguma observação da execução..."></textarea><div class="errbox" id="baixaErr"></div><div style="display:flex;gap:8px;margin-top:15px"><button class="primary" id="btnConfirmarBaixa" onclick="confirmarBaixa('${id}')">Confirmar execução</button><button class="secondary" onclick="fecharModal()">Cancelar</button></div>`;
}
async function confirmarBaixa(id){
  const equipe=document.getElementById('equipe').value.trim();
  if(!equipe){document.getElementById('baixaErr').textContent='Informe a equipe responsável.';document.getElementById('baixaErr').classList.add('show');return;}
  const btn=document.getElementById('btnConfirmarBaixa');btn.disabled=true;btn.textContent='Salvando...';
  try{
    await salvarOcorrenciaRemota({id,status:'Executada',equipe,dataExecucao:agoraFormatado(),obsExec:document.getElementById('obsExec').value});
    await carregarTudo();
    fecharModal();renderExecutores();showToast('Atividade concluída.');
  }catch(e){
    showToast('Falha ao salvar: '+e.message,'error');
    btn.disabled=false;btn.textContent='Confirmar execução';
  }
}
function fecharModal(){document.getElementById('modal').classList.add('hidden');}

(async function init(){
  await carregarTudo();
  initEquipeSelect();
  renderExecutores();
})();
</script>
</body>
</html>
